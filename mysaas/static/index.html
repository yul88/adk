<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mySaaS - Organize & Execute</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>

<body class="landing-page">

  <div class="glass-container text-center animate__animated animate__fadeIn">
    <h1 class="display-3 fw-bold mb-4 gradient-text">mySaaS</h1>
    <p class="lead mb-5 text-light">The ultimate workspace for collecting thoughts and executing plans.</p>

    <div class="d-flex justify-content-center gap-3">
      <button class="btn btn-primary btn-lg glass-btn" onclick="showAuth('signup')">Get Started</button>
      <button class="btn btn-outline-light btn-lg glass-btn" onclick="showAuth('signin')">Sign In</button>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal fade" id="authModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-card">
        <div class="modal-header border-0">
          <h5 class="modal-title" id="authTitle">Sign In</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="authForm">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control glass-input" id="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control glass-input" id="password" required>
            </div>
            <div id="authError" class="text-danger mb-3 d-none"></div>
            <button type="submit" class="btn btn-primary w-100 glass-btn">Go</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let authMode = 'signin';
    const modal = new bootstrap.Modal(document.getElementById('authModal'));

    function showAuth(mode) {
      authMode = mode;
      document.getElementById('authTitle').innerText = mode === 'signup' ? 'Sign Up' : 'Sign In';
      modal.show();
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`/api/${authMode}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          window.location.href = '/dashboard.html';
        } else {
          const err = document.getElementById('authError');
          err.innerText = data.message;
          err.classList.remove('d-none');
        }
      } catch (error) {
        console.error(error);
      }
    });
  </script>
</body>

</html>
